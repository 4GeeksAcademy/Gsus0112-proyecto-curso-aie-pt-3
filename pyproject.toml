[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "tinydb>=4.8,<5",
    "python-jose[cryptography]>=3.4,<4",
    "passlib>=1.7.4,<2",
    "bcrypt>=3.2,<4",
    "python-multipart>=0.0.20",
    "resend>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
seed = "services.api.seed:main"

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["services.api*"]